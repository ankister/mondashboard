# Exemple de déploiement complet (Mon dashboard + agent de la même machine).
# Les images sont publiées automatiquement sur ghcr.io à chaque mise à jour du dépôt :
# ton gestionnaire (Dockhand, Portainer, Watchtower…) peut donc les mettre à jour.
#   1. docker compose -f docker-compose.example.yml up -d mondashboard
#   2. Dans Mon dashboard : Administration → Intégrations → Agent (mode pull,
#      URL http://IP-DU-SERVEUR:9123) → Installer l'agent → « Installation manuelle »
#      et copie la valeur HD_TOKEN dans le fichier .env (HD_TOKEN=...)
#   3. docker compose -f docker-compose.example.yml up -d
services:
  mondashboard:
    image: ghcr.io/ankister/mondashboard:latest
    container_name: mondashboard
    restart: unless-stopped
    ports:
      - "3080:3080"
    environment:
      - TZ=Europe/Paris
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - ./data:/data

  mondashboard-agent:
    image: ghcr.io/ankister/mondashboard-agent:latest
    container_name: mondashboard-agent
    restart: unless-stopped
    network_mode: host
    pid: host
    privileged: true
    # runtime: nvidia            # GPU Nvidia : décommente aussi les 2 variables ci-dessous
    environment:
      - HD_TOKEN=${HD_TOKEN:-}
      - HD_MODE=pull
      - HD_PORT=9123
      # - NVIDIA_VISIBLE_DEVICES=all
      # - NVIDIA_DRIVER_CAPABILITIES=utility
    volumes:
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock
