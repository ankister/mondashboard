# Déploiement sur un serveur Unraid. Copie le dossier homedash dans /mnt/user/appdata/homedash-src
# puis : docker compose -f docker-compose.unraid.yml up -d --build
services:
  homedash:
    build: .
    image: homedash:local
    container_name: homedash
    restart: unless-stopped
    ports:
      - "3080:3080"
    environment:
      - TZ=Europe/Paris
      - PUID=99                 # nobody:users, propriétaire habituel de appdata sur Unraid
      - PGID=100
      # - SECRET_KEY=une-longue-phrase-secrete   # sinon une clé est générée dans /data/.secret_key
    volumes:
      - /mnt/user/appdata/homedash:/data
